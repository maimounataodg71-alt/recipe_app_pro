name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    name: Analyse statique et tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Installer les dépendances
        run: flutter pub get

      - name: Vérifier le formatage
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyse statique (flutter analyze)
        run: flutter analyze

      - name: Tests unitaires et widgets (avec couverture)
        run: flutter test --coverage

      - name: Publier la couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info

  integration-tests:
    name: Tests d'intégration (Chrome)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Installer les dépendances
        run: flutter pub get

      - name: Lancer les tests d'intégration sur Chrome
        run: flutter test integration_test/app_test.dart -d chrome
